<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';

import * as SU from 'three/addons/libs/../utils/SkeletonUtils.js';

</script></body></html>
